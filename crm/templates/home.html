<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login | Workspace</title>
    <style>
        :root {
            --bg:#0B0F14; --bg-elevated:#0F141B; --surface:#141B24; --border:#212B38;
            --text:#E7ECF2; --text-muted:#8B99AC; --info:#5B9DF5;
        }
        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'Inter', sans-serif; display: flex; flex-direction: column; min-height: 100vh;
        }
        main { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }

        /* فرم لاگین هماهنگ با پنل */
        .login-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
            padding: 40px; width: 100%; max-width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .login-title { font-size: 20px; font-weight: 700; margin-bottom: 24px; text-align: center; color: var(--text); }
        .form-group { margin-bottom: 16px; }
        .form-control {
            width: 100%; background: var(--bg-elevated); border: 1px solid var(--border);
            color: var(--text); padding: 12px 16px; border-radius: 8px; font-size: 14px; box-sizing: border-box;
        }
        .form-control:focus { border-color: var(--info); outline: none; }
        .btn-submit {
            width: 100%; background: var(--info); color: white; border: none;
            padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 8px;
        }
        .btn-submit:hover { opacity: 0.9; }

        /* فوتر هماهنگ */
        footer { padding: 20px; text-align: center; color: var(--text-muted); font-size: 12px; border-top: 1px solid var(--border); }
    </style>
</head>
<body>

<main>
    <form method="POST" class="login-card">
        {% csrf_token %}
        <div class="login-title">Sign In to Workspace</div>

        {% if error %}
            <div style="color: #F0665B; margin-bottom: 15px; font-size: 12px; text-align: center;">{{ error }}</div>
        {% endif %}

        <div class="form-group">
            <input type="text" name="username" class="form-control" placeholder="Username" required />
        </div>
        <div class="form-group">
            <input type="password" name="password" class="form-control" placeholder="Password" required />
        </div>
        <button type="submit" class="btn-submit">Login</button>
    </form>
</main>

<footer>
    <div style="display: flex; justify-content: center; gap: 20px; margin-bottom: 8px;">
        <span>📞 +374 93 873064</span>
        <span>📧 rdsdoxa@gmail.com</span>
    </div>
    <div>&copy; 2026 Developed by DOXA RDS. All rights reserved.</div>
</footer>

</body>
</html>
