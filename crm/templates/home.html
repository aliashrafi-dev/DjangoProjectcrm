{% extends "base.html" %}

{% block title %}login{% endblock %}


{% block content %}
    <form method="POST" action="{% url 'home' %}">
        {% csrf_token %}
        <fieldset>


            <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    required
            />

            <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
            />
            <button class="buttonlogin">
                <a href=""></a>
                <h2>Login</h2>
            </button>


        </fieldset>
    </form>



{% endblock %}
